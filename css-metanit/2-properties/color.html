<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color CSS property</title>
  <style>
    .color-class {
        color: red;
    }

    .background-color-class {
        background-color: #11CC00;
        color: white;
    }

    .border-color-class {
        border: 2px solid blue;
        padding: 10px;
    }
  </style>
</head>
<body>
  <div class="color-class">This text is red</div>
  <div class="background-color-class">This has a green background</div>
  <div class="border-color-class">This has a blue border</div>
</body>
</html>
