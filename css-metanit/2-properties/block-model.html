<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Block model</title>
  <style>
     div {
         margin: 15px;
         border: 3px green solid;
         padding: 10px
     }

     .block {
         margin-top: 10px;
         margin-bottom: 20px;
         margin-left: 15px;
         margin-right: 15px;

         border: 5px solid darkred;

         padding: 10px 20px 10px 20px;
     }

     #styled-border {
         width: 100px;
         height: 100px;
         border-style: dotted;
         border-color: brown;
         border-width: 2px;
         border-radius: 15px;
     }
  </style>
</head>
<body>
  <div>
    <p>First block</p>
  </div>
  <div>
    <p>Second block</p>
  </div>
  <div class="block">
    <p>Third block</p>
  </div>
  <div id="styled-border">
    <p>Fourth block</p>
  </div>
</body>
</html>
