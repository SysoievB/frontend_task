<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text formatting</title>
  <style>
    p.capitalize {
        text-transform: capitalize;
        text-decoration: underline;
    }

    p.lowercase {
        text-transform: lowercase;
        text-decoration: overline;
    }

    p.uppercase {
        text-transform: uppercase;
        text-decoration: line-through;
    }

    p.shadow {
      text-shadow: 5px 4px 3px black;
    }
  </style>
</head>
<body>
  <p class="capitalize">Текст использует значение capitalize</p>
  <p class="lowercase">Текст использует значение lowercase</p>
  <p class="uppercase">Текст использует значение uppercase</p>
  <p class="shadow">Текст использует значение text-shadow</p>
</body>
</html>
