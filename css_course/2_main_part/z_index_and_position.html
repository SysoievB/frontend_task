<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Index and Position Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
    }

    .box {
      width: 150px;
      height: 150px;
      position: absolute; /* Needed for z-index to apply */
    }

    .box1 {
      background-color: red;
      top: 50px;
      left: 50px;
      z-index: 1; /* behind others */
    }

    .box2 {
      background-color: blue;
      top: 100px;
      left: 100px;
      z-index: 3; /* in front of red */
    }

    .box3 {
      background-color: green;
      top: 150px;
      left: 150px;
      z-index: 2; /* between red and blue */
    }
  </style>
</head>
<body>
  <h1>Z-Index & Position Demo</h1>
  <p>The blue box has the highest z-index, so it’s on top. Green is in the middle, and red is at the back.</p>

  <div class="box box1"></div>
  <div class="box box2"></div>
  <div class="box box3"></div>
</body>
</html>
